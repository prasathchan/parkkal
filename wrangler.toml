name = "parkkal-dental"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets" }

[[d1_databases]]
binding = "DB"
database_name = "parkkal-db"
database_id = "9928a95f-17d2-4e84-80a1-c7b30d779704"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "parkkal-files"

# ─── Cron Triggers ────────────────────────────────────────────────────────────
# Runs every 15 minutes. Cloudflare delivers a GET to /api/cron/reminders
# with the header x-cloudflare-cron: <expression>.
[triggers]
crons = ["*/15 * * * *"]

# ─── Staging Environment ──────────────────────────────────────────────────────
[env.staging]
name = "parkkal-dental-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "parkkal-db-staging"
database_id = "9ee8ea59-62d7-4cdd-97d4-97a19d4ee3b8"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "parkkal-files-staging"

[env.staging.triggers]
crons = ["*/15 * * * *"]

