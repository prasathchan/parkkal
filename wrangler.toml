name = "parkkal-dental"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
# Custom entrypoint: wraps OpenNext's generated fetch handler and adds the
# scheduled() handler that Cloudflare Cron Triggers invoke. See worker.ts.
main = "worker.ts"
assets = { directory = ".open-next/assets" }

[[d1_databases]]
binding = "DB"
database_name = "parkkal-db"
database_id = "9928a95f-17d2-4e84-80a1-c7b30d779704"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "parkkal-files"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "parkkal-backups"

[[kv_namespaces]]
binding = "CACHE"
id = "274dd63c2e3a417fa2cd030427f00493"

# ─── Cron Triggers ────────────────────────────────────────────────────────────
# Cloudflare delivers each tick to the worker's scheduled() handler (worker.ts),
# which dispatches to the matching /api/cron/* route with an x-cloudflare-cron
# header. */15 → reminders; 0 2 → retention + onboarding (+ nightly backup).
# Keep CRON_ROUTES in worker.ts in sync with this list.
[triggers]
crons = ["*/15 * * * *", "0 2 * * *"]

# ─── Log Drain (Cloudflare Tail Worker) ──────────────────────────────────────
# The tail worker receives a stream of invocation logs from the main worker
# and forwards them to the configured LOG_DRAIN_URL (e.g. Logtail/Betterstack).
# Deploy it separately:  npx wrangler deploy --config wrangler-tail.toml
#
# To activate:
#   1. Deploy src/tail-worker.ts as "parkkal-dental-tail" (see wrangler-tail.toml)
#   2. Set LOG_DRAIN_URL as a Cloudflare secret on the tail worker
#   3. Uncomment the [[tail_consumers]] block below
#
# [[tail_consumers]]
# service = "parkkal-dental-tail"

# ─── Production Environment ───────────────────────────────────────────────────
[env.prod]
name = "parkkal-dental"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "parkkal-db"
database_id = "9928a95f-17d2-4e84-80a1-c7b30d779704"
migrations_dir = "drizzle/migrations"

[[env.prod.r2_buckets]]
binding = "FILES"
bucket_name = "parkkal-files"

[[env.prod.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "parkkal-backups"

[[env.prod.kv_namespaces]]
binding = "CACHE"
id = "274dd63c2e3a417fa2cd030427f00493"

[env.prod.triggers]
crons = ["*/15 * * * *", "0 2 * * *"]

# ─── Staging Environment ──────────────────────────────────────────────────────
[env.staging]
name = "parkkal-dental-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "parkkal-db-staging"
database_id = "9ee8ea59-62d7-4cdd-97d4-97a19d4ee3b8"
migrations_dir = "drizzle/migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "parkkal-files-staging"

[[env.staging.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "parkkal-backups-staging"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "444cde84c40f4c749ae90ebbaa8fff6f"

# No cron triggers on staging — the account free plan has a 5-trigger limit
# across all workers. Keeping triggers on prod only avoids exhausting the quota.

