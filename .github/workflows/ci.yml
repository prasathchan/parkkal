name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit + Integration tests ──────────────────────────────────────
  unit:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings 0

      - name: Unit tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      # Verify all migration files in drizzle/migrations/ have been applied to
      # the local D1 database. Catches forgotten migrations before they reach prod.
      - name: Check migration drift (local)
        run: |
          node scripts/setup-local-db.js
          node scripts/check-migration-drift.js || true
        # || true: local D1 may not have wrangler-managed d1_migrations table in CI;
        # the script prints the diff but doesn't fail the build for local checks.
        # The --remote check in deploy.yml is the authoritative gate.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "### Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Files: $(find src -name '*.test.ts' -o -name '*.test.tsx' | wc -l | tr -d ' ') test files" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: Apply D1 migrations to staging (push to staging only) ────────────
  migrate-staging:
    name: Apply D1 migrations → staging
    runs-on: ubuntu-latest
    needs: unit
    # Only apply when CI is running against the staging branch after a push
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: Apply pending D1 migrations (staging remote)
        # Wrangler reads CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN from env.
        # CLOUDFLARE_D1_DATABASE_ID must be set to the staging D1 database UUID.
        # Add it as a repo secret: Settings → Secrets → CLOUDFLARE_D1_STAGING_ID
        run: |
          npx wrangler d1 migrations apply parkkal-db \
            --database-id ${{ secrets.CLOUDFLARE_D1_STAGING_ID }} \
            --remote
        # Wrangler exits non-zero if any migration fails — job will fail and block
        # the Cloudflare Pages build from deploying a mismatched schema.

      - name: Verify applied migrations
        run: |
          npx wrangler d1 migrations list parkkal-db \
            --database-id ${{ secrets.CLOUDFLARE_D1_STAGING_ID }} \
            --remote
        # Prints the applied/pending list to the CI log for auditability.

  # ── Job 3: E2E tests (only on PRs targeting main) ─────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Only run E2E on PRs to main — too expensive for every push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: unit   # only run E2E if unit tests pass

    env:
      E2E_ADMIN_EMAIL:    ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_BASE_URL:       http://localhost:3000
      # D1 binding for local wrangler dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply local DB migrations
        run: npm run db:migrate

      - name: Seed test data
        run: node scripts/setup-local-db.js

      - name: Start dev server (background)
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for dev server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
