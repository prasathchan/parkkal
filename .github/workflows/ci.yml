name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit + Integration tests ──────────────────────────────────────
  unit:
    name: Type-check · Lint · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings 0

      - name: Unit tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "### Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Files: $(find src -name '*.test.ts' -o -name '*.test.tsx' | wc -l | tr -d ' ') test files" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: E2E tests (only on PRs targeting main) ─────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Only run E2E on PRs to main — too expensive for every push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: unit   # only run E2E if unit tests pass

    env:
      E2E_ADMIN_EMAIL:    ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_BASE_URL:       http://localhost:3000
      # D1 binding for local wrangler dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply local DB migrations
        run: npm run db:migrate

      - name: Seed test data
        run: node scripts/setup-local-db.js

      - name: Start dev server (background)
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for dev server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
