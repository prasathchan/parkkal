name: Build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npx next build
        env:
          JWT_SECRET: ci-stub-secret-minimum-32-characters-ok
          NODE_ENV: production
          SKIP_ENV_VALIDATION: '1'
