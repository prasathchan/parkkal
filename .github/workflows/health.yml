name: Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # APP_URL must be set as a GitHub Actions secret (Settings → Secrets → Actions).
    # Until the app is deployed and the secret is configured, this job is skipped
    # so the workflow always passes without generating false-alarm failure emails.
    steps:
      - name: Skip if APP_URL not configured
        if: ${{ env.APP_URL == '' }}
        run: |
          echo "APP_URL secret not set — skipping health check ping."
          echo "Set APP_URL to your deployed worker URL (e.g. https://parkkal-dental.<account>.workers.dev)"
        env:
          APP_URL: ${{ secrets.APP_URL }}

      - name: Check production health
        if: ${{ env.APP_URL != '' }}
        run: |
          URL="${APP_URL}/api/cron/health"
          echo "Pinging: $URL"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production health check failed (HTTP $STATUS) — $URL"
            exit 1
          fi
          echo "Health check passed."
        env:
          APP_URL: ${{ secrets.APP_URL }}
