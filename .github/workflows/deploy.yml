name: Deploy to Cloudflare

# Deploys to Cloudflare Workers (via OpenNext) on every push to main.
# CI must pass first — this workflow depends on the "ci" workflow completing
# successfully via the "workflow_run" trigger.
#
# Required GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN    — Wrangler API token (Workers:Edit, D1:Edit scopes)
#   CLOUDFLARE_ACCOUNT_ID   — Your Cloudflare account ID
#
# Required GitHub repository variables (Settings → Variables):
#   CLOUDFLARE_DATABASE_ID  — D1 database ID (from wrangler.toml)
#
# How to set up:
#   1. Go to dash.cloudflare.com → Workers & Pages → API Tokens → Create Token
#      Use "Edit Cloudflare Workers" template, add D1:Edit permission.
#   2. Add both secrets + variable in your repo Settings → Secrets & Variables.
#   3. Merge this file to main — first deploy will happen automatically.

on:
  push:
    branches: [main]

# Only one deploy at a time — cancel any in-progress deploy if a newer commit
# lands on main before it finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─── Gate: must pass all checks before deploying ───────────────────────────
  check:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  # ─── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: check
    environment: production     # requires manual approval if you enable it in repo settings
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g npm@11 && npm ci

      # Build Next.js app for Cloudflare Workers via OpenNext
      - name: Build (OpenNext for Cloudflare)
        run: npm run cf:build
        env:
          NODE_ENV: production

      # Apply any pending D1 migrations before the new worker code goes live.
      # This runs BEFORE wrangler deploy so the schema is ready when workers boot.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply parkkal-db --remote
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy the worker + assets to Cloudflare
      - name: Deploy worker
        run: npx wrangler deploy --env=prod
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
